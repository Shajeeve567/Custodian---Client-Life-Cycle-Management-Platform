name: Staging — Document Service

on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/services/Documents/**'
      - '.github/workflows/deploy-document.yml'

jobs:
  deploy:
    name: Build & Deploy Document Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore backend/src/services/Documents

      - name: Build
        run: dotnet build backend/src/services/Documents --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/src/services/Documents --no-build --configuration Release --verbosity normal

      - name: Publish
        run: dotnet publish backend/src/services/Documents --configuration Release --output ./publish/documents

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_DOCUMENT_STAGING_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_DOCUMENT_STAGING_PUBLISH_PROFILE }}
          package: ./publish/documents
