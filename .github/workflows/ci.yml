name: CI - Build & Test

on:
    push:
        branches: [dev, main]
    pull_request:
        branches: [dev, main]

jobs:
    backend:
        name: Build & Test - ${{ matrix.service }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service:
                    - backend/src/services/Audit
                    - backend/src/services/Documents
                    - backend/src/services/Identity
                    - backend/src/services/Workflow

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .NET 9
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '9.0.x'

            - name: Restore dependencies
              run: dotnet restore ${{ matrix.service }}

            - name: Build
              run: dotnet build ${{ matrix.service }} --no-restore --configuration Release
              
            - name: Run tests
              run: dotnet test ${{ matrix.service }} --no-build --configuration Release --verbosity normal