name: CI — Build & Test

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  backend:
    name: Build & Test — Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore backend/Custodian.sln

      - name: Build
        run: dotnet build backend/Custodian.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/Custodian.sln --no-build --configuration Release --verbosity normal