name: Mutation Tests — Backend

# Stryker.NET mutation testing for every backend test project (see stryker-config.json in each).
# Pull requests: only code changed against the target branch is mutated (--since), and the check
# fails below the break threshold. Manual and weekly runs mutate everything, as a full baseline.
# Kept out of ci.yml so the normal build-and-test check stays fast.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/mutation-tests.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # Mondays 02:00 UTC

concurrency:
  group: mutation-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail below this score. Must not be above the "low" threshold (60) in stryker-config.json.
  BREAK_AT: 60

jobs:
  stryker:
    name: Stryker — ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # one service below the threshold should not hide the others' results
      matrix:
        project:
          - Identity.Tests
          - Custodian.Workflow.Tests
          - Custodian.Audit.Tests
          - Custodian.Documents.Tests
          - Custodian.Shared.Tests

    defaults:
      run:
        working-directory: backend/tests/${{ matrix.project }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --since compares against the target branch, so full history is needed

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restore Stryker (pinned in .config/dotnet-tools.json)
        run: dotnet tool restore

      - name: Run Stryker
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SINCE="--since:origin/${{ github.base_ref }}"
          else
            SINCE=""
          fi
          dotnet stryker $SINCE \
            --break-at "$BREAK_AT" \
            --reporter html --reporter markdown --reporter progress \
            --output StrykerOutput/ci

      - name: Publish score to the run summary
        if: always()
        run: |
          REPORT=StrykerOutput/ci/reports/mutation-report.md
          {
            echo "## ${{ matrix.project }}"
            if [ -f "$REPORT" ]; then
              cat "$REPORT"
            else
              echo "No mutants to test (no changed source files in this project)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-${{ matrix.project }}
          path: backend/tests/${{ matrix.project }}/StrykerOutput/ci/reports
          if-no-files-found: ignore
          retention-days: 14
