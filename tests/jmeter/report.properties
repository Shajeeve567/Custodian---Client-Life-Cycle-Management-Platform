# Result-file and HTML dashboard settings for custodian-load.jmx (pass with: -q report.properties). No secrets.

# Write the spike phase (baseline / spike / recovery) as an extra column in the .jtl,
# so response times can be compared before, during and after the spike.
sample_variables=spikePhase

# --- HTML dashboard (-e -o) ---
jmeter.reportgenerator.report_title=Custodian staging - load & performance

# Leave the setUp samples (guard, schedule builder, sign-in) out of the dashboard and statistics.json:
# they run once and are not part of the load. The filter keeps labels that match this regex.
jmeter.reportgenerator.sample_filter=^(?!setUp:|Guard:).*

# APDEX (user satisfaction, 0..1): a sample is "satisfied" up to T ms, "tolerated" up to F ms, else "frustrated".
# APDEX = (satisfied + tolerated / 2) / total. Defaults match the p95 read target in sla.json.
jmeter.reportgenerator.apdex_satisfied_threshold=800
jmeter.reportgenerator.apdex_tolerated_threshold=3000
# The PDF report renders a document, so users accept it being slower (regex:T|F).
jmeter.reportgenerator.apdex_per_transaction=.*sla-performance.*:3000|10000

# One point per 5 s on the "over time" graphs (default 60 s is too coarse for runs of a few minutes).
jmeter.reportgenerator.overall_granularity=5000
