global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # The 4 production App Service apps (Southeast Asia). /metrics needs Basic auth: user "prometheus",
  # password = Metrics__ScrapeKey (read from a file so the key is not in this config).
  - job_name: custodian
    scheme: https
    metrics_path: /metrics
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/scrape_key
    static_configs:
      - targets: ["custodian-identity-prod-gr-cmbqdggxh7gzevgg.southeastasia-01.azurewebsites.net"]
        labels: { service: identity }
      - targets: ["custodian-workflow-prod-gr-fgcecrfea6cue2d6.southeastasia-01.azurewebsites.net"]
        labels: { service: workflow }
      - targets: ["custodian-documents-prod-gr-cbc5b5bydgehb3cn.southeastasia-01.azurewebsites.net"]
        labels: { service: documents }
      - targets: ["custodian-audit-prod-gr-fmfbdfcnfse9bbfz.southeastasia-01.azurewebsites.net"]
        labels: { service: audit }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
